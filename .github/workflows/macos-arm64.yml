name: macOS arm64 wheels

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    env:
      CC: /usr/bin/clang
      ARCHFLAGS: -arch arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: arm64

      - name: Build wheel
        run: |
          python -c "import platform; assert platform.machine() == 'arm64'"
          python -m pip install build
          python -m build --wheel

      - name: Test installed wheel
        run: |
          python -m pip install --only-binary=:all: dist/*-macosx_*_universal2.whl h5py
          python -m pip check
          cd "$RUNNER_TEMP"
          python -m pytest -c "$GITHUB_WORKSPACE/pyproject.toml" --pyargs pycraf --remote-data=none

      - uses: actions/upload-artifact@v7
        with:
          name: pycraf-macos-arm64-py${{ matrix.python-version }}
          path: dist/*-macosx_*_universal2.whl
          if-no-files-found: error
